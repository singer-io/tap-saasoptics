version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-saasoptics
            source /usr/local/share/virtualenvs/tap-saasoptics/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - add_ssh_keys
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json /usr/local/share/virtualenvs/tap-saasoptics/lib/python3.12/site-packages/tap_saasoptics/schemas/*.json
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-saasoptics/bin/activate
            uv pip install pytest coverage
            mkdir -p test_output
            coverage run --branch --source=tap_saasoptics -m pytest tests/unittests --junitxml=test_output/report.xml
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-saasoptics/bin/activate
            coverage report -m --fail-under=99
            coverage html
      - store_test_results:
          path: test_output/report.xml
      - store_artifacts:
          path: htmlcov
      - store_artifacts:
          path: coverage.txt
      - run:
          name: 'Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-saasoptics/bin/activate
            python -m pytest tests --ignore=tests/unittests
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
